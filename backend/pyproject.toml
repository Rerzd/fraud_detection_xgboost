# Tooling for the backend: ruff (lint and format), pytest and coverage.
# Run from the repository root with `npm run lint:py`, `npm run format:py` and `npm run test:api`.

[tool.ruff]
line-length = 100
target-version = "py313"
# `app` is the package; tests import `conftest` through pytest's pythonpath.
src = [".", "tests"]
# The training notebook is a record of how the model was built: never reformat or lint it.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

# Coverage looks for its config in the current directory, so from the repository root pass
# `--cov-config=backend/pyproject.toml` (the npm script and the CI job do).
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Measured line coverage of `app` is 100%, so the gate is 100: a new line needs a test. The rule
# was "measured coverage rounded down to a multiple of 5"; lower this if it proves too strict.
fail_under = 100
